<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Identity Card</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .id-card {
      width: 340px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      border: 1px solid #e0e0e0;
      position: relative;
    }

    /* Top Decorative Header Accent */
    .id-card-header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .photo-container {
      margin-top: -45px;
      display: flex;
      justify-content: center;
    }

    .profile-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: #ddd;
    }

    .id-card-body {
      padding: 16px 24px 24px 24px;
      text-align: center;
    }

    .name {
      margin: 8px 0 4px 0;
      font-size: 1.25rem;
      color: #1a1a1a;
      font-weight: 700;
    }

    .badge-title {
      display: inline-block;
      background-color: #e8f0fe;
      color: #1a73e8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .info-group {
      text-align: left;
      font-size: 0.85rem;
      color: #5f6368;
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
      margin-top: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .info-label {
      font-weight: 600;
      color: #3c4043;
    }

    .about-text {
      text-align: left;
      font-size: 0.8rem;
      color: #666;
      line-height: 1.4;
      margin: 12px 0;
      background: #fafafa;
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #1a73e8;
    }

    .website-link {
      display: block;
      margin-top: 16px;
      text-decoration: none;
      color: #ffffff;
      background-color: #1a73e8;
      padding: 8px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background-color 0.2s ease;
    }

    .website-link:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>

  <div class="id-card">
    <div class="id-card-header"></div>
    
    <div class="photo-container">
      <img id="user-image" class="profile-img" src="" alt="Profile Image">
    </div>

    <div class="id-card-body">
      <h2 id="user-name" class="name">Loading...</h2>
      <span id="user-profession" class="badge-title">...</span>

      <div class="about-text" id="user-about"></div>

      <div class="info-group">
        <div class="info-row">
          <span class="info-label">Experience:</span>
          <span id="user-years">-</span>
        </div>
      </div>

      <a id="user-website" class="website-link" href="#" target="_blank">Visit Portfolio</a>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
